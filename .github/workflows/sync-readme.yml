name: Sync README to profile repo

on:
  push:
    branches: [master]
    paths: [README.md]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push README to profile repo
        run: |
          git clone https://x-access-token:${{ secrets.PROFILE_SYNC_TOKEN }}@github.com/imchristianlowe/imchristianlowe.git profile-repo
          cp README.md profile-repo/README.md
          cd profile-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Sync README from pages repo"
          git push
